# Student Grade Reporting Configuration

project:
  name: "Student Progress & Grade Reports"
  type: "student_grades"

# Input Excel Sources
data_sources:
  # Scan data/grades or Downloads for Excel workbooks
  directory: "data/grades"
  file_pattern: "*.xlsx"
  sheet_name: "Assignment Data"
  header_row: 2   # 1-indexed: Headers are in Row 2
  contacts_directory: "data/contacts"
  contacts_file_pattern: "*.xlsx"

# Grade Calculation Rules
grade_calculation:
  weighted_by_category: true
  exclude_missing_until_graded: true
  
  # Four categories summing to 100%:
  categories:
    Homework: 0.35
    Essays: 0.35
    Teams Discussion: 0.20
    Attendance/Participation: 0.10

# Individual Student Drafts Configuration
email:
  audience: "individual_drafts"

  # Draft Destination:
  # - "eml": Generate RFC 822 .eml draft files on disk in output/drafts/ (default)
  # - "outlook": Populate drafts directly into Microsoft Outlook Drafts folder (via COM / IMAP sync)
  draft_target: "eml"

  # Microsoft Account Selection (when draft_target is "outlook"):
  # - "work": Organizational Microsoft 365 account (default)
  # - "personal": Personal Microsoft account (@live.com, @outlook.com, @hotmail.com)
  # - Or specify an exact email address (e.g., "teacher@school.org")
  m365_account: "work"

  subject_template: "Progress Report: {student_name} - {course_name}"
  template_html: "templates/student_report.html"
  template_text: "templates/student_report.txt"
  dashboard_template: "templates/drafts_dashboard.html"
  output_drafts_dir: "output/drafts"
